<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathFlash | Smart Math Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.73/build/spline-viewer.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

        body {
            background-color: #030308;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }

        .spline-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: auto; 
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #030308 95%);
            z-index: 1;
            pointer-events: none;
        }

        .content-layer {
            position: relative;
            z-index: 10;
        }

        spline-viewer {
            width: 100%;
            height: 100%;
        }

        .font-serif { font-family: 'Playfair Display', serif; }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-slate-300 antialiased">

    <div class="spline-container">
        <spline-viewer url="https://prod.spline.design/uILr2PwSxHtivmIs/scene.splinecode"></spline-viewer>
    </div>

    <div class="bg-overlay"></div>

    <div class="content-layer min-h-screen flex flex-col">
        
        <nav class="border-b border-white/5 bg-black/40 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                <div class="flex items-center cursor-pointer group" onclick="window.location.reload()">
                    <div class="flex items-end space-x-[2px] mr-3 h-4 mb-1">
                        <div class="w-[2px] h-2 bg-white/80 rounded-full group-hover:h-3 transition-all"></div>
                        <div class="w-[2px] h-4 bg-white/80 rounded-full group-hover:h-2 transition-all"></div>
                        <div class="w-[2px] h-3 bg-white/80 rounded-full group-hover:h-5 transition-all"></div>
                        <div class="w-[2px] h-[6px] bg-white/80 rounded-full group-hover:h-3 transition-all"></div>
                    </div>
                    <span class="font-bold text-xl text-white">Math<span class="font-light text-slate-400">Flash</span></span>
                </div>
                <div id="nav-actions">
                    <button onclick="window.location.reload()" class="bg-white/10 hover:bg-white/20 border border-white/10 text-white px-5 py-2 rounded-full text-sm transition">
                        Reset
                    </button>
                </div>
            </div>
        </nav>

        <main class="flex-grow pt-12 pb-20">
            <div id="view-home" class="max-w-5xl mx-auto p-6">
                <div class="text-center mb-16">
                    <h1 class="text-5xl md:text-7xl font-serif text-white mb-6 drop-shadow-2xl">
                        Smart Math for stupid people
                    </h1>
                    <p class="text-slate-400 max-w-2xl mx-auto">Select a module to begin. We've simplified the complex so you can actually get through your homework.</p>
                </div>
                <div id="topic-cards-container" class="grid md:grid-cols-3 gap-6">
                    </div>
            </div>

            <div id="view-quiz" class="max-w-3xl mx-auto p-6 hidden">
                <div class="glass rounded-3xl p-10 shadow-2xl">
                    <div class="flex justify-between items-center mb-8">
                        <span id="quiz-category" class="text-xs uppercase tracking-widest text-purple-400 font-bold">Category</span>
                        <span id="quiz-progress" class="text-xs text-slate-500">Question 1/5</span>
                    </div>
                    <h2 id="question-text" class="text-3xl font-serif text-white mb-8 leading-tight">Loading...</h2>
                    <div id="options-container" class="grid gap-4">
                        </div>
                </div>
            </div>
        </main>

        <footer class="py-8 text-center bg-black/60 backdrop-blur-md border-t border-white/5">
            <p class="text-slate-500 text-sm">Created by <span class="text-white font-medium">Euro</span></p>
        </footer>
    </div>

    <script>
        const quizData = {
            "central-tendencies": { 
                title: "Central Tendencies", 
                icon: "bar-chart-2", 
                desc: "Master Mean, Median, and Mode without the headache.",
                questions: [
                    { q: "What is the 'Mode' of a data set?", a: ["The average", "The middle value", "The most frequent value", "The range"], correct: 2 },
                    { q: "If a set is [2, 2, 4, 10], what is the Median?", a: ["2", "3", "4", "4.5"], correct: 1 }
                ]
            },
            "best-line-fit": { 
                title: "Best Line Fit", 
                icon: "trending-up", 
                desc: "Predicting the future using scatter plots and trends.",
                questions: [
                    { q: "In y = mx + b, what does 'm' represent?", a: ["The y-intercept", "The slope", "The variable", "The correlation"], correct: 1 }
                ]
            },
            "exponential": { 
                title: "Exponential Functions", 
                icon: "activity", 
                desc: "Growth, decay, and things that escalate quickly.",
                questions: [
                    { q: "Which of these represents exponential growth?", a: ["y = 2x + 5", "y = 5(1.2)^x", "y = 10 - x", "y = x²"], correct: 1 }
                ]
            }
        };

        let currentQuestions = [];
        let currentQuestionIndex = 0;

        function initHome() {
            const container = document.getElementById('topic-cards-container');
            container.innerHTML = Object.entries(quizData).map(([key, topic]) => `
                <div onclick="startQuiz('${key}')" class="glass p-8 rounded-2xl hover:border-purple-500/50 transition-all cursor-pointer group">
                    <div class="w-12 h-12 bg-purple-500/10 rounded-xl flex items-center justify-center mb-6 border border-purple-500/20 group-hover:scale-110 transition-transform">
                        <i data-lucide="${topic.icon}" class="text-purple-400"></i>
                    </div>
                    <h3 class="text-2xl font-serif text-white mb-2">${topic.title}</h3>
                    <p class="text-slate-400 text-sm mb-6">${topic.desc}</p>
                    <span class="text-purple-400 text-sm font-bold flex items-center group-hover:translate-x-2 transition-transform">Initialize →</span>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function startQuiz(id) {
            const topic = quizData[id];
            currentQuestions = topic.questions;
            currentQuestionIndex = 0;
            
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            document.getElementById('quiz-category').innerText = topic.title;
            
            showQuestion();
        }

        function showQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('quiz-progress').innerText = `Question ${currentQuestionIndex + 1}/${currentQuestions.length}`;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = q.a.map((opt, i) => `
                <button onclick="handleAnswer(${i})" class="w-full text-left p-5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 hover:border-purple-500/30 transition-all text-slate-200">
                    ${opt}
                </button>
            `).join('');
        }

        function handleAnswer(index) {
            const isCorrect = index === currentQuestions[currentQuestionIndex].correct;
            
            if (isCorrect) {
                alert("Correct! You're actually smart.");
            } else {
                alert("Wrong. Maybe the headline was right?");
            }

            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                alert("Module Complete!");
                window.location.reload();
            }
        }

        initHome();
    </script>
</body>
</html>
