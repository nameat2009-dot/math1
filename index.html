<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathFlash | Smart Math Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.73/build/spline-viewer.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

        body { background-color: #030308; margin: 0; overflow-x: hidden; font-family: 'Inter', sans-serif; }

        .spline-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: auto; 
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #030308 90%);
            z-index: 1;
            pointer-events: none;
        }

        .content-layer { position: relative; z-index: 10; }
        .font-serif { font-family: 'Playfair Display', serif; }

        .glass {
            background: rgba(12, 12, 20, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.8s ease-out forwards; }
    </style>
</head>
<body class="text-slate-300 antialiased">

    <div class="spline-container">
        <spline-viewer url="https://prod.spline.design/uILr2PwSxHtivmIs/scene.splinecode"></spline-viewer>
    </div>

    <div class="bg-overlay"></div>

    <div class="content-layer min-h-screen flex flex-col">
        
        <nav class="border-b border-white/5 bg-black/40 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
                <div class="flex items-center cursor-pointer" onclick="location.reload()">
                    <span class="font-bold text-xl text-white">Math<span class="font-light text-slate-400">Flash</span></span>
                </div>
                <div class="flex items-center gap-6">
                    <a href="https://github.com" target="_blank" class="text-slate-400 hover:text-white transition flex items-center gap-2 text-sm">
                        <i data-lucide="github" class="w-4 h-4"></i> Repository
                    </a>
                    <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-full text-sm font-medium transition shadow-lg shadow-indigo-500/20">
                        Get Started
                    </button>
                </div>
            </div>
        </nav>

        <main class="flex-grow pt-12 pb-20 px-6">
            
            <div id="view-home" class="max-w-5xl mx-auto animate-slide-up">
                <div class="text-center mb-12">
                    <h1 class="text-5xl md:text-7xl font-serif text-white mb-6 drop-shadow-2xl">
                        Smart Math for stupid people
                    </h1>
                </div>

                <div class="max-w-3xl mx-auto mb-20">
                    <div class="glass rounded-2xl p-2 flex items-center shadow-2xl">
                        <input id="ai-input" type="text" placeholder="Paste raw data or math problems here..." 
                               class="flex-grow bg-transparent border-none outline-none px-6 py-4 text-white placeholder:text-slate-500">
                        <button onclick="runOpenAI()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-4 rounded-xl font-bold transition-all flex items-center gap-2">
                            <i data-lucide="sparkles" class="w-5 h-5"></i> Process with AI
                        </button>
                    </div>
                    
                    <div id="ai-response" class="mt-4 p-6 glass rounded-2xl hidden border-indigo-500/30">
                        <div class="flex items-center gap-3 mb-3 text-indigo-400 font-bold text-xs uppercase tracking-widest">
                            <i data-lucide="zap" class="w-4 h-4"></i> OpenAI Analysis Result
                        </div>
                        <p id="ai-text" class="text-slate-300 leading-relaxed italic">Generating understanding...</p>
                    </div>
                </div>

                <div id="topic-cards-container" class="grid md:grid-cols-3 gap-6"></div>
            </div>

            <div id="view-quiz" class="max-w-3xl mx-auto p-6 hidden animate-slide-up">
                <div class="bg-black/60 backdrop-blur-xl rounded-3xl p-10 border border-white/10 shadow-2xl">
                    <button onclick="showHome()" class="mb-8 text-slate-500 hover:text-white flex items-center gap-2 text-sm transition">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i> Back to Hub
                    </button>
                    <h2 id="question-text" class="text-3xl font-serif text-white mb-8">Loading...</h2>
                    <div id="options-container" class="space-y-4"></div>
                </div>
            </div>
        </main>

        <footer class="py-12 text-center bg-black/60 backdrop-blur-md border-t border-white/5">
            <div class="flex justify-center gap-8 mb-6">
                <div class="flex items-center gap-2 text-xs font-medium text-slate-500 uppercase tracking-tighter">
                    <i data-lucide="code-2" class="w-4 h-4"></i> Open Source
                </div>
                <div class="flex items-center gap-2 text-xs font-medium text-slate-500 uppercase tracking-tighter">
                    <i data-lucide="brain-circuit" class="w-4 h-4"></i> OpenAI GPT-4o
                </div>
            </div>
            <p class="text-slate-500 text-sm">Created by <span class="text-white font-medium">Euro</span> • © 2026</p>
        </footer>
    </div>

    <script>
        const quizData = {
            "central-tendencies": { 
                title: "Central Tendencies", 
                icon: "bar-chart-2", 
                desc: "Mean, Median, Mode, Range, and Standard Deviation.",
                q: "Which value is most affected by outliers?",
                a: ["Median", "Mean", "Mode", "IQR"],
                c: 1
            },
            "best-line-fit": { 
                title: "Best Line Fit", 
                icon: "trending-up", 
                desc: "Scatter plots, linear regression, and correlation coefficients.",
                q: "What does an r-value of -0.95 suggest?",
                a: ["Weak Positive", "Strong Positive", "Strong Negative", "No Correlation"],
                c: 2
            },
            "exponential": { 
                title: "Exponential Functions", 
                icon: "activity", 
                desc: "Growth, decay, and identifying exponential equations.",
                q: "In y = ab^x, if b > 1, the graph shows:",
                a: ["Linear Growth", "Exponential Decay", "Exponential Growth", "Constant Slope"],
                c: 2
            }
        };

        function initHome() {
            const container = document.getElementById('topic-cards-container');
            container.innerHTML = Object.entries(quizData).map(([key, topic]) => `
                <div onclick="startQuiz('${key}')" class="glass p-8 rounded-2xl hover:border-indigo-500/50 transition-all cursor-pointer group">
                    <div class="w-12 h-12 bg-indigo-500/10 rounded-xl flex items-center justify-center mb-6 border border-indigo-500/20 group-hover:scale-110 transition-transform">
                        <i data-lucide="${topic.icon}" class="text-indigo-400"></i>
                    </div>
                    <h3 class="text-2xl font-serif text-white mb-2">${topic.title}</h3>
                    <p class="text-slate-400 text-sm mb-6">${topic.desc}</p>
                    <span class="text-indigo-400 text-sm font-bold flex items-center">Initialize <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i></span>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function runOpenAI() {
            const input = document.getElementById('ai-input').value;
            if(!input) return;
            
            const resp = document.getElementById('ai-response');
            const text = document.getElementById('ai-text');
            
            resp.classList.remove('hidden');
            text.innerText = "Processing through OpenAI Math Engine...";
            
            // Simulating API latency
            setTimeout(() => {
                text.innerHTML = `<strong>Analysis Complete:</strong> Your input shows a clear <strong>Exponential Decay</strong> trend. The rate of change is decreasing relative to the initial value. Start the Exponential Functions module for a deep dive.`;
            }, 1500);
        }

        function startQuiz(id) {
            const data = quizData[id];
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            document.getElementById('question-text').innerText = data.q;
            document.getElementById('options-container').innerHTML = data.a.map((opt, i) => `
                <button onclick="alert('${i === data.c ? 'Correct! 🧠' : 'Not quite. Try again.'}')" class="w-full text-left p-4 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 hover:border-indigo-500/40 text-slate-300 transition-all">
                    ${opt}
                </button>
            `).join('');
        }

        function showHome() {
            document.getElementById('view-quiz').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
        }

        initHome();
    </script>
</body>
</html>
