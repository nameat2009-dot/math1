<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathFlash | Smart Math Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap');
        
        body { background-color: #030308; font-family: 'Inter', sans-serif; }
        .serif-title { font-family: 'Playfair Display', serif; }
        
        .animate-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(20, 20, 35, 0.4) 0%, rgba(10, 10, 20, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="text-slate-300">

    <div class="fixed top-[-10%] left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-purple-900/20 blur-[120px] rounded-full pointer-events-none"></div>

    <nav class="flex justify-between items-center px-8 py-6 max-w-7xl mx-auto relative z-10">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="location.reload()">
            <div class="flex space-x-0.5 items-end h-5">
                <div class="w-1 h-3 bg-indigo-500"></div>
                <div class="w-1 h-5 bg-indigo-400"></div>
                <div class="w-1 h-4 bg-indigo-300"></div>
            </div>
            <span class="font-bold text-xl text-white tracking-tight">Math<span class="font-light text-slate-400">Flash</span></span>
        </div>
        <button class="bg-white/5 hover:bg-white/10 border border-white/10 text-white px-5 py-2 rounded-full text-sm transition">Get Started</button>
    </nav>

    <main id="app-container" class="max-w-6xl mx-auto px-6 pt-20 relative z-10">
        <div id="home-view" class="animate-in">
            <div class="text-center mb-20">
                <h1 class="serif-title text-5xl md:text-7xl text-white mb-6">Smart Math for stupid people</h1>
                <p class="text-slate-400 max-w-xl mx-auto text-lg leading-relaxed">
                    Select a module to process central tendencies, regressions, and exponential logic.
                </p>
            </div>

            <div class="grid md:grid-cols-3 gap-6" id="card-grid">
                </div>
        </div>

        <div id="quiz-view" class="hidden max-w-2xl mx-auto animate-in">
            <button onclick="showHome()" class="text-slate-500 hover:text-white mb-8 flex items-center gap-2 transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to modules
            </button>
            <div class="glass-card p-10 rounded-3xl">
                <div id="quiz-header" class="text-xs uppercase tracking-widest text-indigo-400 font-bold mb-4">Topic</div>
                <h2 id="question-text" class="serif-title text-3xl text-white mb-8">Question Loading...</h2>
                <div id="options-list" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <script>
        const modules = [
            { id: 'central', title: 'Central Tendencies', desc: 'Mean, Median, Mode, and Standard Deviation.', icon: 'bar-chart', questions: [{q: "What is the mean of 2, 4, 6?", a: ["4", "5", "6"], c: 0}] },
            { id: 'line', title: 'Best Line Fit', desc: 'Scatter plots and linear regressions.', icon: 'trending-up', questions: [{q: "What does 'r' represent?", a: ["Slope", "Correlation", "Intercept"], c: 1}] },
            { id: 'expo', title: 'Exponential Functions', desc: 'Growth, decay, and identifying equations.', icon: 'zap', questions: [{q: "If b > 1, the function is...", a: ["Decay", "Growth", "Linear"], c: 1}] }
        ];

        function renderHome() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = modules.map(m => `
                <div onclick="startQuiz('${m.id}')" class="glass-card p-8 rounded-2xl cursor-pointer group hover:border-indigo-500/50 transition-all">
                    <div class="w-12 h-12 bg-indigo-500/10 rounded-xl flex items-center justify-center mb-6 border border-indigo-500/20">
                        <i data-lucide="${m.icon}" class="text-indigo-400 w-6 h-6"></i>
                    </div>
                    <h3 class="text-2xl text-white mb-3">${m.title}</h3>
                    <p class="text-slate-500 text-sm mb-8">${m.desc}</p>
                    <div class="text-indigo-400 text-sm font-bold flex items-center gap-2">Initialize <i data-lucide="arrow-right" class="w-4 h-4"></i></div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function startQuiz(id) {
            const module = modules.find(m => m.id === id);
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            document.getElementById('quiz-header').innerText = module.title;
            document.getElementById('question-text').innerText = module.questions[0].q;
            
            const options = document.getElementById('options-list');
            options.innerHTML = module.questions[0].a.map((opt, i) => `
                <button onclick="alert('Correct!')" class="w-full text-left p-4 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 hover:border-white/20 text-slate-300 transition-all">
                    ${opt}
                </button>
            `).join('');
        }

        function showHome() {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
        }

        window.onload = renderHome;
    </script>
</body>
</html>
