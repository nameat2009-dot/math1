<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathFlash | Smart Math Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.73/build/spline-viewer.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

        body {
            background-color: #030308;
            margin: 0;
            overflow-x: hidden;
        }

        /* The 3D Canvas Background */
        .spline-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; /* Behind everything */
            /* This allows mouse movement to pass through to Spline 
               OR you can set it to auto if you want to rotate the earth directly */
            pointer-events: auto; 
        }

        /* Overlay to ensure text is readable against the 3D scene */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #030308 90%);
            z-index: 1;
            pointer-events: none; /* Crucial: clicks must pass through this layer */
        }

        /* Main Content must be above the background */
        .content-layer {
            position: relative;
            z-index: 10;
        }

        spline-viewer {
            width: 100%;
            height: 100%;
        }

        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="text-slate-300 antialiased">

    <div class="spline-container">
        <spline-viewer url="https://prod.spline.design/uILr2PwSxHtivmIs/scene.splinecode"></spline-viewer>
    </div>

    <div class="bg-overlay"></div>

    <div class="content-layer min-h-screen flex flex-col">
        
        <nav class="border-b border-white/5 bg-black/40 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                <div class="flex items-center cursor-pointer" onclick="location.reload()">
                    <span class="font-bold text-xl text-white">Math<span class="font-light text-slate-400">Flash</span></span>
                </div>
                <div id="nav-actions">
                    <button class="bg-white/10 hover:bg-white/20 border border-white/10 text-white px-5 py-2 rounded-full text-sm transition">
                        Get Started
                    </button>
                </div>
            </div>
        </nav>

        <main class="flex-grow pt-12 pb-20">
            <div id="view-home" class="max-w-5xl mx-auto p-6">
                <div class="text-center mb-16">
                    <h1 class="text-5xl md:text-7xl font-serif text-white mb-6 drop-shadow-2xl">
                        Smart Math for stupid people
                    </h1>
                </div>
                <div id="topic-cards-container" class="grid md:grid-cols-3 gap-6">
                    </div>
            </div>

            <div id="view-quiz" class="max-w-3xl mx-auto p-6 hidden">
                <div class="bg-black/60 backdrop-blur-xl rounded-3xl p-10 border border-white/10 shadow-2xl">
                    <h2 id="question-text" class="text-3xl font-serif text-white mb-8">Loading...</h2>
                    <div id="options-container" class="space-y-4"></div>
                </div>
            </div>
        </main>

        <footer class="py-8 text-center bg-black/60 backdrop-blur-md border-t border-white/5">
            <p class="text-slate-500 text-sm">Created by <span class="text-white font-medium">Euro</span></p>
        </footer>
    </div>

    <script>
        // Use the JavaScript logic from your previous message here!
        // Just make sure your function startQuiz('id') switches the views correctly.
        // I've simplified the card injection for this example:
        
        const quizData = {
            "central-tendencies": { title: "Central Tendencies", icon: "bar-chart-2", desc: "Mean, Median, Mode..." },
            "best-line-fit": { title: "Best Line Fit", icon: "trending-up", desc: "Scatter plots..." },
            "exponential": { title: "Exponential Functions", icon: "activity", desc: "Growth and decay..." }
        };

        function initHome() {
            const container = document.getElementById('topic-cards-container');
            container.innerHTML = Object.entries(quizData).map(([key, topic]) => `
                <div onclick="alert('Starting ' + '${topic.title}')" class="bg-black/40 backdrop-blur-md border border-white/10 p-8 rounded-2xl hover:border-purple-500/50 transition-all cursor-pointer group">
                    <div class="w-12 h-12 bg-purple-500/10 rounded-xl flex items-center justify-center mb-6 border border-purple-500/20 group-hover:scale-110 transition-transform">
                        <i data-lucide="${topic.icon}" class="text-purple-400"></i>
                    </div>
                    <h3 class="text-2xl font-serif text-white mb-2">${topic.title}</h3>
                    <p class="text-slate-400 text-sm mb-6">${topic.desc}</p>
                    <span class="text-purple-400 text-sm font-bold flex items-center">Initialize →</span>
                </div>
            `).join('');
            lucide.createIcons();
        }
        initHome();
    </script>
</body>
</html>
